<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — ANIS OS</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      background: #050816;
      color: #cbd5e1;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 480px; }
    .code {
      font-size: 96px;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #4F46E5, #06B6D4, #8B5CF6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    h1 { color: #fff; font-size: 20px; margin: 16px 0 8px; }
    p { font-size: 13px; line-height: 1.7; color: #64748b; margin: 0 0 24px; }
    a {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 13px;
      color: #fff;
      background: linear-gradient(135deg, #4F46E5, #8B5CF6);
      box-shadow: 0 0 24px rgba(79, 70, 229, 0.35);
    }
    .hint { margin-top: 28px; font-size: 11px; color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The address you requested doesn’t exist in this operating system. Head back home to explore the interface.</p>
    <a href="./">Return to ANIS OS</a>
    <p class="hint">You will be redirected automatically in a moment.</p>
  </div>
  <script>
    // Support ?to=/some-path#anchor redirects from the app shell.
    try {
      var params = new URLSearchParams(window.location.search);
      var target = params.get('to');
      if (target) { window.location.replace(target); }
    } catch (e) { /* noop */ }
    setTimeout(function () { window.location.href = './'; }, 8000);
  </script>
</body>
</html>
